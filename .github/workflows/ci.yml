name: ci

# Offline, deterministic: lint + the offline test suite. No API key, no network,
# no dataset. The drivers' `providers` seam takes fake components, so the full
# metric path runs on a clean checkout — verified by running the suite against an
# empty HF cache, not by assuming it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q
