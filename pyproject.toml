[project]
name = "rag-eval"
version = "0.1.0"
description = "Evaluation-first RAG: a reusable metric harness that measures a RAG pipeline, then shows what the metrics miss"
readme = "README.md"
authors = [{ name = "Steven Pequeno", email = "steven@pequeno.in" }]
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.11",
    "datasets>=5.0.1",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
